name: Promote

# Open the PR that moves an environment to a released product version (docs/release-plan.md).
# dev is normally promoted by `Release product`; staging and prod are promoted here and merged by a person.
# Rollback is the same workflow with the previous version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "product version (X.Y.Z); must have a releases/vX.Y.Z.yaml manifest"
        required: true
        type: string
      env:
        description: "environment"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The version must be a released one
        run: |
          v="${{ inputs.version }}"; v="${v#v}"
          test -f "releases/v$v.yaml" || { echo "::error::no manifest releases/v$v.yaml — release it first"; exit 1; }

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: cvhome-saas
          repositories: cvhome-platform

      - name: Let git push with the App token
        # gh uses GH_TOKEN, but plain `git push` in a cloned checkout has no credentials of its own.
        run: git config --global url."https://x-access-token:${{ steps.app.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Open the promotion PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          v="${{ inputs.version }}"; v="${v#v}"; e="${{ inputs.env }}"
          scripts/clone.sh cvhome-platform
          cd cvhome-platform
          git config user.name "release-bot"; git config user.email "release-bot@users.noreply.github.com"
          git switch -c "promote/$e-$v" --no-track origin/main
          python3 ../scripts/release.py promote --version "$v" --env "$e" --platform .
          git diff --quiet && { echo "$e already runs $v"; exit 0; }
          git commit -am "promote: $e -> $v"
          git push -u origin HEAD
          url=$(gh pr create --base main --title "promote: $e -> $v" \
            --body "Deploys product version **$v** to **$e**. Manifest: cvhome-saas/orchestrator releases/v$v.yaml. Merge to deploy (the platform pipeline applies on main). Rollback: run Promote with the previous version.")
          echo "- $e promotion PR: $url" >> "$GITHUB_STEP_SUMMARY"
