name: Release

# The one button (docs/release-plan.md): one version for every repo. Tags vX.Y.Z on main in each repo
# that has `tag: true` in repos.yaml, creates a GitHub release with generated notes in each, writes
# releases/vX.Y.Z.yaml here. That is all a release is: a compatibility record across repos. Nothing here
# deploys, publishes an artifact, or touches an environment.
#
# Needs a GitHub App installed on the org with contents:write + pull_requests:write on the tagged repos,
# stored as secrets RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY (GITHUB_TOKEN cannot act on other repos).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto (from cvhome's merged PR labels) | patch | minor | major"
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      version:
        description: "explicit version (X.Y.Z) — overrides bump; 2.0.0 for the cut-over"
        required: false
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: cvhome-saas

      - name: Which repos get the tag
        id: repos
        run: echo "list=$(python3 scripts/release.py tagged-repos)" >> "$GITHUB_OUTPUT"

      - name: Let git push with the App token
        # gh uses GH_TOKEN, but plain `git push` in a cloned checkout has no credentials of its own.
        run: git config --global url."https://x-access-token:${{ steps.app.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Clone them at main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/clone.sh ${{ steps.repos.outputs.list }}

      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else
            v="$(python3 scripts/release.py next-version --bump "${{ inputs.bump }}")" || { echo "::error::nothing to release"; exit 1; }
          fi
          v="${v#v}"
          for r in ${{ steps.repos.outputs.list }}; do
            if git -C "$r" ls-remote --exit-code --tags origin "v$v" >/dev/null 2>&1; then echo "::error::$r already has v$v"; exit 1; fi
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "## Releasing v$v" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate — every repo green on main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for r in ${{ steps.repos.outputs.list }}; do
            sha=$(git -C "$r" rev-parse HEAD)
            bad=$(gh api "repos/cvhome-saas/$r/commits/$sha/check-runs" --jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length')
            [ "$bad" = "0" ] || { echo "::error::$r main ($sha) has $bad failed check runs"; exit 1; }
          done

      - name: Gate — cross-repo contracts agree
        run: python3 scripts/contract-check.py --only catalog,edges,env,public-ecr

      - name: Tag and release every repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          for r in ${{ steps.repos.outputs.list }}; do
            sha=$(git -C "$r" rev-parse HEAD)
            gh api -X POST "repos/cvhome-saas/$r/git/refs" -f ref="refs/tags/v$V" -f sha="$sha" >/dev/null
            url=$(gh release create "v$V" -R "cvhome-saas/$r" --target "$sha" --title "v$V" --generate-notes)
            echo "- $r v$V at ${sha:0:8}: $url" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Write the release manifest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release.py manifest --version "$V"
          git config user.name "release-bot"; git config user.email "release-bot@users.noreply.github.com"
          git add "releases/v$V.yaml"
          git commit -m "release: v$V"
          git push
          { echo '```yaml'; cat "releases/v$V.yaml"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
