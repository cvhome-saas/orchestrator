# Manifest of the cvhome-saas GitHub organisation (https://github.com/cvhome-saas): every public repo,
# what it is for, and which files to open first. All of them are part of development and are cloned
# next to this file by scripts/clone.sh (which reads this manifest); scripts/status.sh reports on them;
# the org-router skill reads `kind` and `usage` to route tasks.
#
# kind: app | infra | tool | image | plugin | docs | ideas | mirror
# dir:  local directory name when it differs from the repo name
# tag:  true = receives the product tag vX.Y.Z on every release (docs/release-plan.md); one version everywhere
org: cvhome-saas
repos:
  - name: orchestrator
    kind: docs
    url: https://github.com/cvhome-saas/orchestrator.git
    usage: This repo. The org root that agents start in - repo manifest, clone/status scripts, the routing skills (org-router, fullstack-task, infra-task, tools-task, docs-task, cross-repo-change) and the reviewer (cross-repo-review, scripts/impact.py, scripts/contract-check.py).
    entry: [CLAUDE.md, repos.yaml, .agents/skills/org-router/SKILL.md]

  - name: cvhome
    tag: true
    kind: app
    url: https://github.com/cvhome-saas/cvhome.git
    usage: The application monorepo. Java 25 / Spring Boot microservices, Angular console-ui, Next.js landing-ui, one Gradle composite build. Source of truth for services and ports (common-config.yml). Builds every service image, including store-pod/spg on top of the saas-gateway image.
    entry: [AGENTS.md, .claude/skills/project-structure/SKILL.md, lcl.yml, settings.gradle]

  - name: cvhome-platform
    tag: true
    kind: infra
    url: https://github.com/cvhome-saas/cvhome-platform.git
    usage: AWS infrastructure. Terraform (ECS Fargate, Cloud Map, ALB/NLB, RDS, CloudFront) plus the one-click CloudFormation bootstrap and the CodeBuild pipeline that builds cvhome's images and applies. services.yaml mirrors the app catalog and is drift-checked in CI.
    entry: [README.md, CLAUDE.md, services.yaml, flavours.yaml, .claude/plans/infra-implementation-plan.md]

  - name: lcl
    tag: true
    kind: tool
    url: https://github.com/cvhome-saas/lcl.git
    usage: Public npm CLI @cvhome-saas/lcl. Language-neutral local stack runner driven by one lcl.yml. cvhome depends on it; cvhome owns only its lcl.yml. load-testing reads live ports from `lcl urls`.
    entry: [AGENTS.md, README.md, schema/lcl.schema.json]

  - name: load-testing
    kind: tool
    url: https://github.com/cvhome-saas/load-testing.git
    usage: k6 load, stress, soak, breakpoint and browser suite for cvhome. Runs against an lcl stack (TARGET=lcl) or AWS; writes to Prometheus and annotates Grafana. Its thresholds are aligned with the app's SLO histogram buckets.
    entry: [AGENTS.md, README.md, docs/coverage.md, Makefile]

  - name: e2e-testing
    kind: tool
    url: https://github.com/cvhome-saas/e2e-testing.git
    usage: Playwright end-to-end suite for cvhome. Scaffold only so far (default config, one example spec, a Playwright CI workflow); no baseURL, no app journeys yet. The place browser regression tests go when they are written; k6 browser scripts in load-testing cover performance, not correctness.
    entry: [playwright.config.ts, tests/, .github/workflows/playwright.yml]

  - name: saas-gateway
    tag: true
    kind: image
    url: https://github.com/cvhome-saas/saas-gateway.git
    usage: Caddy base image (xcaddy with certmagic-s3 + caddy-domainlookup, alpine runtime) that cvhome/store-pod/spg builds FROM. Publishes latest + sha-<short> to Docker Hub on push to main; public-dkr mirrors a chosen sha to public ECR; cvhome pins that sha.
    entry: [Dockerfile, .github/workflows/docker-publish.yml]

  - name: caddy-domainlookup
    tag: true
    kind: plugin
    url: https://github.com/cvhome-saas/caddy-domainlookup.git
    usage: Caddy v2 middleware `domain_lookup` that maps the request host to tenant headers (Store-Id, Theme, ...) via merchant's lookup-by-domain API, cached, failing open. Compiled into saas-gateway from source path.
    entry: [domainlookup.go, go.mod]

  - name: certmagic-s3
    tag: true
    kind: plugin
    url: https://github.com/cvhome-saas/certmagic-s3.git
    usage: Org fork of the certmagic S3 storage backend (aws-sdk-go-v2). Gives Caddy `storage s3 { bucket region prefix endpoint }` so every spg task shares on-demand certificates through the per-pod cert bucket. Compiled into saas-gateway.
    entry: [storage.go, s3.go, README.md]

  - name: aws-otel-collector
    tag: true
    kind: image
    url: https://github.com/cvhome-saas/aws-otel-collector.git
    usage: ADOT collector image with the project config baked in (OTLP 4317/4318 in; X-Ray, EMF, CloudWatch Logs out; metric prefix filter). One per environment on AWS, referenced from cvhome-platform services.yaml `infra.otel-collector` by :latest.
    entry: [otel-config.yaml, Dockerfile]

  - name: public-dkr
    kind: mirror
    url: https://github.com/cvhome-saas/public-dkr.git
    usage: GitHub Actions matrix that pulls images from Docker Hub / gcr.io and pushes them to the org's public ECR (public.ecr.aws/b2i4h4k9). This is the mirror step between saas-gateway's Docker Hub build and the sha cvhome pins, and it supplies node, postgres, otel-contrib, zipkin, paketo and distroless base images. Add or bump an image = edit the matrix and push main.
    entry: [.github/workflows/push-images.yml, README.md]

  - name: assets
    kind: docs
    url: https://github.com/cvhome-saas/assets.git
    usage: Static assets served raw from GitHub - fast-run/fast-run.sh and its docker-compose.yml, the one-command evaluation install the docs site links to. Its hosts and image list describe the 1.0.x layout (core-auth, store-ui, welcome-ui, merchant-ui, order); refresh it with the current service catalog before pointing anyone at it.
    entry: [fast-run/fast-run.sh, fast-run/docker-compose.yml]

  - name: cvhome-saas.github.io
    kind: docs
    url: https://github.com/cvhome-saas/cvhome-saas.github.io.git
    usage: Public VitePress documentation site on GitHub Pages. Content dates from 2025-06 and describes an older service layout; rewrite from the project-structure skill and cvhome-platform docs.
    entry: [docs/.vitepress/config.mts, docs/guide/architecture-overview.md]

  - name: .github
    dir: dot-github
    kind: docs
    url: https://github.com/cvhome-saas/.github.git
    usage: Organisation profile README shown on github.com/cvhome-saas (what cvhome is, links to the docs site). Community health defaults for every repo live here too if added.
    entry: [profile/README.md]

  - name: ideation
    kind: ideas
    url: https://github.com/cvhome-saas/ideation.git
    usage: Product backlog as Markdown feature docs (F-001 .. F-008) with a template and status table. Module names in it are aspirational; map them to the current layout when an idea becomes a plan.
    entry: [README.md, features/]
